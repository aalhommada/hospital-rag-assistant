# The labelled question set.
#
# This is the most valuable file in the repository and the one most projects
# never write. Without it, "I improved retrieval" is an opinion. With it, it is
# a number that either went up or did not.
#
# Every entry has an `intent`, which is what the router should decide:
#
#   information    the documents answer it; `document` names which one should
#                  be retrieved, and `must_contain` is a phrase the retrieved
#                  passages have to include for the answer to be possible
#   out_of_scope   nothing in the corpus answers it, so retrieval must return
#                  nothing and the assistant must say so
#   clinical_advice must be refused — the honest answer needs a medical record
#   emergency      must be redirected to 999 immediately
#   appointment    must go to the booking tools, not to search
#
# Add a row every time you find a question the assistant handles badly. That is
# how the set earns its keep.

# --- Questions the documents answer ---------------------------------------

- question: Can I eat before an MRI scan?
  intent: information
  document: preparing-for-an-mri-scan
  must_contain: six hours

- question: What should I bring to my MRI appointment?
  intent: information
  document: preparing-for-an-mri-scan
  must_contain: appointment letter

- question: I have a pacemaker, is that a problem for a scan?
  intent: information
  document: preparing-for-an-mri-scan
  must_contain: pacemaker

- question: How long do MRI results take?
